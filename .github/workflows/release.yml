name: Release

# Releases @dalcvil/steam-green-react with Changesets (https://changesets.dev).
#
# It never runs on a plain push. It is triggered by the CI workflow finishing
# on `main` and only proceeds when that run succeeded, so a commit that fails
# typecheck, the library build or the Storybook build can never produce a
# release. changesets/action then either:
#   1. opens/updates the "chore: version packages" pull request while unreleased
#      changesets exist, or
#   2. publishes to npm, pushes the release tag and creates the GitHub release
#      once that PR is merged (leaving main with no pending changesets).
#
# Add a changeset to any PR that changes the published package:
#
#   pnpm changeset
#
# `workflow_dispatch` is kept as a manual escape hatch. GitHub has no way to
# declare "admins only" on a workflow trigger, so the first step of the job
# re-checks the actor's repository role and aborts unless it is `admin`. (The
# dispatch button itself is only shown to users who already have write access.)
#
# Publishing authenticates with npm trusted publishing (OIDC): there is no
# NPM_TOKEN secret and no long-lived credential anywhere in this workflow. The
# package carries a trusted publisher on npmjs.com
# (Packages -> @dalcvil/steam-green-react -> Settings -> Trusted publishing)
# that must match exactly:
#
#   Publisher   GitHub Actions
#   Repository  Dalcvi/steam-style-react
#   Workflow    release.yml
#   Environment (blank - this job declares none)
#
# The connection has to permit a direct `npm publish`. `pnpm publish` runs
# unattended here, so a stage-only connection would park every release in the
# staged-publishing queue for manual 2FA approval instead of shipping it.
#
# Also enable "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General, otherwise the version pull request cannot be
# opened.

on:
  # Completes on every CI run; the job-level `if` below drops anything that did
  # not conclude successfully. `branches` filters on the branch of the CI run,
  # so pull-request runs are ignored and only pushes to main can release.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version commits, release tags and GitHub releases
  pull-requests: write # the "chore: version packages" pull request
  id-token: write # npm provenance

jobs:
  release:
    name: Version & publish
    # A failed CI run must never be able to publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require repository admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if ! role=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission); then
            echo "::error::Could not resolve the repository role for ${ACTOR}."
            exit 1
          fi
          echo "${ACTOR} has repository role: ${role}"
          if [ "${role}" != "admin" ]; then
            echo "::error::${ACTOR} is '${role}', not 'admin'. Only admins may run this workflow."
            exit 1
          fi

      # workflow_run reports the commit CI validated, which is what should be
      # released rather than whatever the default branch tip happens to be now.
      # Full history keeps the tag/release bookkeeping happy.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version mode: rewrites package.json + CHANGELOG.md and opens the PR.
      # Publish mode: runs `pnpm run release`, and `pnpm publish` triggers the
      # prepublishOnly guard (typecheck + build) before uploading the tarball.
      - name: Create release pull request or publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The npm CLI attaches provenance automatically once OIDC is in use.
          # pnpm only does so when asked, so keep this explicit.
          NPM_CONFIG_PROVENANCE: "true"