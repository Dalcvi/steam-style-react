name: Release

# Releases @dalcvil/steam-green-react with Changesets (https://changesets.dev).
#
# Every push to main runs changesets/action, which either:
#   1. opens/updates the "chore: version packages" pull request while unreleased
#      changesets exist, or
#   2. publishes to npm, pushes the release tag and creates the GitHub release
#      once that PR is merged (leaving main with no pending changesets).
#
# Add a changeset to any PR that changes the published package:
#
#   pnpm changeset
#
# Requires an npm Automation token in the repository secret NPM_TOKEN
# (Settings -> Secrets and variables -> Actions) and the "Allow GitHub Actions
# to create and approve pull requests" option enabled under Actions -> General.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # version commits, release tags and GitHub releases
  pull-requests: write # the "chore: version packages" pull request
  id-token: write # npm provenance

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version mode: rewrites package.json + CHANGELOG.md and opens the PR.
      # Publish mode: runs `pnpm run release`, and `pnpm publish` triggers the
      # prepublishOnly guard (typecheck + build) before uploading the tarball.
      - name: Create release pull request or publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"